spring:
  application:
    name: whatsapp-mvp-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/whatsapp_mvp}
    username: ${SPRING_DATASOURCE_USERNAME:wamvp_user}
    password: ${SPRING_DATASOURCE_PASSWORD:devpassword123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate        # Flyway gestiona el schema; Hibernate solo valida
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ── JWT ─────────────────────────────────────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:devsecretlongstringforjwtatleast64charslongfortesting123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}          # 24h
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}  # 7 días

  # ── AI Provider (Groq — OpenAI-compatible) ──────────────────────────────────
  openai:
    api-key: ${GROQ_API_KEY:}
    model: ${AI_MODEL:llama-3.1-8b-instant}
    max-tokens: ${AI_MAX_TOKENS:500}
    temperature: ${AI_TEMPERATURE:0.4}
    base-url: ${AI_BASE_URL:https://api.groq.com/openai/v1}

  # ── WhatsApp Service ────────────────────────────────────────────────────────
  whatsapp:
    service-url: ${WA_SERVICE_URL:http://localhost:3001}
    webhook-secret: ${WA_WEBHOOK_SECRET:devsecret}

  # ── Admin inicial ────────────────────────────────────────────────────────────
  admin:
    email: ${ADMIN_EMAIL:admin@example.com}
    password: ${ADMIN_PASSWORD:admin123}
    full-name: Administrador
    phone: ${ADMIN_PHONE:}

  # ── Rate Limiting ────────────────────────────────────────────────────────────
  rate-limit:
    max-messages-per-window: 10
    window-minutes: 5

  # ── Upload ──────────────────────────────────────────────────────────────────
  uploads:
    base-path: ${UPLOADS_PATH:/app/uploads}
    base-url: ${UPLOADS_BASE_URL:http://localhost:8080/uploads}
